# Install: pip install pre-commit && pre-commit install
# Run manually against everything: pre-commit run --all-files
#
# Mirrors what .github/workflows/ci.yml's lint job checks, so issues
# surface locally before a push rather than in CI. See that workflow's
# comment on why its lint job is currently non-blocking (continue-on-error)
# -- these hooks were written against the same not-yet-locally-verified
# ruff/black configuration; run `pre-commit run --all-files` yourself
# once to confirm a clean baseline before relying on this to gate commits.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^flask_aegis/

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        files: ^flask_aegis/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
